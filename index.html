<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Аяты вокруг нас</title>
<meta name="description" content="Игра для детей о единобожии: попробуй сам и пойми, что так может только Аллах.">
<meta name="theme-color" content="#1E5F74">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <div id="stage"></div>

  <header id="top">
    <button id="tHome" class="pill logo" aria-label="Меню">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M25 6a15 15 0 1 0 9 26A13 13 0 1 1 25 6z" fill="#FFD54F"/><path d="M30 12l1.6 3.4 3.7.5-2.7 2.6.7 3.7-3.3-1.8-3.3 1.8.7-3.7-2.7-2.6 3.7-.5z" fill="#FFD54F"/></svg>
      <span>Аяты</span>
    </button>
    <div class="tright">
      <button id="tBag" class="pill" aria-label="Мои сокровища"><span class="ico">✦</span><b id="bagN">0</b></button>
      <button id="tVoice" class="pill round" aria-label="Голос" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm-7 9a7 7 0 0 0 6 6.9V21h2v-2.1a7 7 0 0 0 6-6.9h-2a5 5 0 0 1-10 0z"/></svg>
      </button>
      <button id="tSfx" class="pill round" aria-label="Звуки" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
    </div>
  </header>

  <section id="cap" class="hidden" aria-live="polite">
    <p id="capText"></p>
    <p id="capNote"></p>
    <div id="capBtns"></div>
  </section>

  <section id="start">
    <div class="sbox">
      <svg class="slogo" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="56" fill="#1E5F74"/>
        <path d="M70 22a38 38 0 1 0 22 66A33 33 0 1 1 70 22z" fill="#FFD54F"/>
        <path d="M82 38l3.4 7 7.7 1.1-5.6 5.4 1.3 7.6-6.8-3.6-6.8 3.6 1.3-7.6-5.6-5.4 7.7-1.1z" fill="#FFD54F"/>
      </svg>
      <p class="bism" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <h1>Аяты вокруг нас</h1>
      <p class="sub">Игра о единобожии и основах ислама для детей</p>
      <div class="sbtns">
        <button id="goCont" class="btn big" hidden>Продолжить</button>
        <button id="go" class="btn big">Начать</button>
        <button id="goCh" class="btn ghost">Главы</button>
      </div>
      <p class="hint-sound">Играть лучше со звуком</p>
      <p class="credits">Перевод смыслов Корана: Э. Кулиев. Чтец: Мишари аль-Афаси. Голос: Silero TTS.</p>
    </div>
  </section>

  <div id="fade"></div>
</div>
<script src="js/lines.js"></script>
<script src="js/ayat.js"></script>
<script src="js/engine.js"></script>
<script src="js/chapters.js"></script>
</body>
</html>
