<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Аяты вокруг нас</title>
<meta name="description" content="Бесплатная игра для детей о единобожии: попробуй сам и пойми, что так может только Аллах.">
<meta name="theme-color" content="#0E2A3A">
<meta property="og:title" content="Аяты вокруг нас">
<meta property="og:description" content="Бесплатная игра для детей о единобожии и основах ислама">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <div id="stage"></div>

  <header id="top">
    <button id="tHome" class="pill" aria-label="Главы">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>Главы</span>
    </button>
    <div class="tright">
      <button id="tBag" class="pill" aria-label="Мои сокровища">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z" fill="#F5C451"/></svg>
        <b id="bagN">0</b>
      </button>
      <button id="tVoice" class="pill round" aria-label="Голос" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button id="tSfx" class="pill round" aria-label="Звуки" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <section id="cap" class="hidden" aria-live="polite">
    <span id="capTalk" aria-hidden="true"><i></i><i></i><i></i></span>
    <p id="capText"></p>
    <p id="capNote"></p>
    <div id="capBtns"></div>
  </section>

  <section id="start">
    <svg class="hero" viewBox="0 0 400 860" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0B2236"/><stop offset=".45" stop-color="#1D4A66"/><stop offset=".72" stop-color="#C98A6B"/><stop offset=".86" stop-color="#F2C98A"/>
        </linearGradient>
        <radialGradient id="hGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".55"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
        <linearGradient id="hD1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C5368"/><stop offset="1" stop-color="#1A3A4C"/></linearGradient>
        <linearGradient id="hD2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173444"/><stop offset="1" stop-color="#0E2533"/></linearGradient>
      </defs>
      <rect width="400" height="860" fill="url(#hSky)"/>
      <g class="twinkle" fill="#FFF6DD">
        <circle cx="40" cy="70" r="1.6"/><circle cx="96" cy="140" r="1.1"/><circle cx="150" cy="52" r="1.4"/><circle cx="210" cy="118" r="1"/><circle cx="262" cy="40" r="1.7"/>
        <circle cx="352" cy="96" r="1.2"/><circle cx="380" cy="180" r="1"/><circle cx="20" cy="210" r="1.1"/><circle cx="120" cy="250" r="1"/><circle cx="330" cy="260" r="1.3"/>
        <circle cx="70" cy="330" r=".9"/><circle cx="240" cy="300" r="1"/><circle cx="186" cy="200" r="1.2"/><circle cx="300" cy="170" r=".9"/>
      </g>
      <circle cx="300" cy="150" r="90" fill="url(#hGlow)"/>
      <path d="M312 104a46 46 0 1 0 26 84A40 40 0 1 1 312 104z" fill="#FFE29A"/>
      <path d="M352 120l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="#FFE29A"/>
      <path d="M0 660 Q90 600 190 640 T400 610 V860 H0Z" fill="url(#hD1)"/>
      <g fill="#1A3A4C">
        <rect x="248" y="560" width="70" height="60" rx="3"/>
        <path d="M252 562 Q283 512 314 562Z"/>
        <rect x="280" y="520" width="6" height="14" rx="2"/>
        <rect x="232" y="520" width="10" height="100" rx="3"/><path d="M230 522 L237 498 L244 522Z"/>
        <rect x="324" y="520" width="10" height="100" rx="3"/><path d="M322 522 L329 498 L336 522Z"/>
      </g>
      <path d="M0 720 Q120 670 230 705 T400 690 V860 H0Z" fill="url(#hD2)"/>
    </svg>
    <div class="sbox">
      <p class="bism" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <h1>Аяты<br>вокруг нас</h1>
      <p class="sub">Игра о единобожии и основах ислама для детей</p>
      <div class="sbtns">
        <button id="goCont" class="btn big" hidden>Продолжить</button>
        <button id="go" class="btn big">Начать</button>
        <button id="goCh" class="btn glass">Главы</button>
      </div>
      <p class="hint-sound">Играть лучше со звуком</p>
      <p class="credits">Перевод смыслов Корана: Э. Кулиев · Чтец: Мишари аль-Афаси · Голос: Silero TTS</p>
    </div>
  </section>

  <div id="fade"></div>
</div>
<script src="js/lines.js"></script>
<script src="js/ayat.js"></script>
<script src="js/engine.js"></script>
<script src="js/chapters.js"></script>
</body>
</html>
