<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Аяты вокруг нас</title>
<meta name="description" content="Бесплатная игра для детей о единобожии: попробуй сам и пойми, что так может только Аллах.">
<meta name="theme-color" content="#0E2A3A">
<meta property="og:title" content="Аяты вокруг нас">
<meta property="og:description" content="Бесплатная игра для детей о единобожии и основах ислама">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <div id="stage"></div>

  <header id="top">
    <button id="tHome" class="pill" aria-label="Главы">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>Главы</span>
    </button>
    <div class="tright">
      <button id="tBag" class="pill" aria-label="Мои сокровища">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z" fill="#F5C451"/></svg>
        <b id="bagN">0</b>
      </button>
      <button id="tVoice" class="pill round" aria-label="Голос" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button id="tSfx" class="pill round" aria-label="Звуки" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <section id="cap" class="hidden" aria-live="polite">
    <span id="capTalk" aria-hidden="true"><i></i><i></i><i></i></span>
    <p id="capText"></p>
    <p id="capNote"></p>
    <div id="capBtns"></div>
  </section>

  <section id="start">
    <div class="hero" aria-hidden="true">
      <svg class="stars" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice"><g class="twinkle" fill="#FFF6DD"><circle cx="40" cy="40" r="1.6"/><circle cx="96" cy="90" r="1.1"/><circle cx="150" cy="26" r="1.4"/><circle cx="214" cy="70" r="1"/><circle cx="250" cy="20" r="1.7"/><circle cx="372" cy="44" r="1.2"/><circle cx="386" cy="130" r="1"/><circle cx="20" cy="120" r="1.1"/><circle cx="120" cy="150" r="1"/><circle cx="180" cy="110" r="1.2"/><circle cx="66" cy="190" r="0.9"/><circle cx="340" cy="170" r="1"/><circle cx="300" cy="80" r="1.1"/><circle cx="16" cy="60" r="1"/><circle cx="280" cy="140" r="0.9"/><circle cx="60" cy="130" r="1.3"/><circle cx="232" cy="170" r="1"/><circle cx="392" cy="96" r="1.2"/></g></svg>
      <svg class="moon" viewBox="0 0 100 100">
        <defs><radialGradient id="hGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".45"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient></defs>
        <circle cx="50" cy="50" r="50" fill="url(#hGlow)"/>
        <path d="M52 22a28 28 0 1 0 16 51A24 24 0 1 1 52 22z" fill="#FFE29A"/>
        <path d="M72 30l2 4.1 4.5.7-3.3 3.2.8 4.5-4-2.1-4 2.1.8-4.5-3.3-3.2 4.5-.7z" fill="#FFE29A"/>
      </svg>
      <svg class="skyline" viewBox="0 0 240 150">
        <g fill="#163444">
          <rect x="36" y="44" width="12" height="106" rx="2"/><rect x="32" y="72" width="20" height="5" rx="2"/><rect x="33" y="40" width="18" height="5" rx="2"/><path d="M35 41 L42 14 L49 41Z"/><rect x="41" y="6" width="2" height="9"/>
          <rect x="192" y="44" width="12" height="106" rx="2"/><rect x="188" y="72" width="20" height="5" rx="2"/><rect x="189" y="40" width="18" height="5" rx="2"/><path d="M191 41 L198 14 L205 41Z"/><rect x="197" y="6" width="2" height="9"/>
          <rect x="62" y="96" width="116" height="54" rx="2"/>
          <path d="M78 98 C78 72 96 60 120 50 C144 60 162 72 162 98Z"/>
          <rect x="118.6" y="34" width="2.8" height="17" rx="1"/><circle cx="120" cy="32" r="3.4"/>
          <path d="M62 98 C62 86 70 80 76 78 C82 80 90 86 90 98Z"/><path d="M150 98 C150 86 158 80 164 78 C170 80 178 86 178 98Z"/>
        </g>
        <g fill="#FFD98A">
          <path d="M108 150 V128 a12 12 0 0 1 24 0 V150Z" opacity=".9"/>
          <path d="M80 140 V122 a6 6 0 0 1 12 0 V140Z" opacity=".75"/><path d="M148 140 V122 a6 6 0 0 1 12 0 V140Z" opacity=".75"/>
          <path d="M115 84 V76 a5 5 0 0 1 10 0 V84Z" opacity=".6"/>
        </g>
      </svg>
      <svg class="dunes" viewBox="0 0 400 60" preserveAspectRatio="none">
        <path d="M0 26 Q100 6 200 22 T400 14 V60 H0Z" fill="#1E4255"/>
        <path d="M0 42 Q130 28 250 38 T400 34 V60 H0Z" fill="#163444"/>
      </svg>
    </div>
    <div class="sbox">
      <p class="bism" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <h1>Аяты<br>вокруг нас</h1>
      <p class="sub">Игра о единобожии и основах ислама для детей</p>
      <div class="sbtns">
        <button id="goCont" class="btn big" hidden>Продолжить</button>
        <button id="go" class="btn big">Начать</button>
        <button id="goCh" class="btn glass">Главы</button>
        <button id="goVoice" class="chip">Голос: <b>Ксения</b></button>
      </div>
      <p class="hint-sound">Играть лучше со звуком</p>
      <p class="credits">Перевод смыслов Корана: Э. Кулиев · Чтец: Мишари аль-Афаси · Голоса: Silero TTS, Piper</p>
    </div>
  </section>

  <div id="fade"></div>
</div>
<script src="js/lines.js"></script>
<script src="js/w12_lines.js"></script>
<script src="js/w3_lines.js"></script>
<script src="js/w4_lines.js"></script>
<script src="js/w5_lines.js"></script>
<script src="js/ayat.js"></script>
<script src="js/engine.js"></script>
<script src="js/chapters.js"></script>
<script src="js/w12.js"></script>
<script src="js/w3.js"></script>
<script src="js/w4.js"></script>
<script src="js/w5.js"></script>
<script src="js/main.js"></script>
</body>
</html>
