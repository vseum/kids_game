server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # страница и скрипты всегда свежие, чтобы обновления игры приходили сразу
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache";
    }

    # озвучка и картинки кэшируются надолго
    location ~* \.(mp3|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
}
